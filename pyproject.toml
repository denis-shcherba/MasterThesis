[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MasterThesis"
version = "0.0.1"
description = "A short description of your package"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Denis Shcherba", email = "d.e.shcherba@gmail.com" }
]
license = { text = "MIT" }
keywords = ["robotics", "policy", "pointnet", "deep learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "torch",
    "numpy",
    "torchvision",
    "hydra-core",
    "h5py",
    "matplotlib",
    "robotic",
    "omegaconf",
    "lxml",
    "trimesh",
    "wandb",
    "tqdm"
]

[project.urls]
"Homepage" = "https://github.com/denis-shcherba/master_thesis"

[project.scripts]
# Add CLI tools here if needed
# e.g. train = "policy_network.training.trainer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


robot_mode: normal         # "normal" or "floating"
path_mode: pos3d
simulate: true
botop: false
on_real: false
camera_name: cameraStatic    # or "cameraWrist"
env: table

allow_book_yaw: false

box_size_ranges:
  x: [0.08, 0.1]
  y: [0.13, 0.15]
  z: [0.04, 0.06]

box_offset_ranges:
  x: [-0.2, 0.2]
  y: [-0.1, 0.05] 

table_offset_ranges:
  width: [0.0, 0.0]
  length: [0.0, 0.0]
  yaw: [0, 0]

camera_offset_ranges:
  x: [0.0, 0.0]
  y: [-0.25, -0.25]
  z: [0, 0.]

camera_rpy_ranges:
  roll: [0, 0]
  pitch: [0, 0]
  yaw: [0, 0]

focal_length_range: [0.895, 0.895]

depth_noise_ranges:
  active: True
  binocular_baseline: [.02, .05]
  depth_smoothing: [1, 1]
  noise_all: [.1, .2]
  noise_wide: [0., 0.3]
  noise_local: [0., 0.2]
  noise_pixel: [0.0, 0.03]


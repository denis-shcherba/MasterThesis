
robot_mode: normal         # "normal" or "floating"
path_mode: pos3d_rel

simulate: false
botop: true
on_real: true
camera_name: cameraWrist
env: table

q0: [.0, -1.2, .0, -2.4, 0. , 1.6, -0.8]

allow_book_yaw: false

box_size_ranges:
  x: [0.08, 0.1]
  y: [0.13, 0.15]
  z: [0.04, 0.06]

box_offset_ranges:
  x: [-0.15, 0.15]
  y: [-0.1, 0.05] 


table_offset_ranges:
  width: [0.0, 0.0]
  length: [0.05, 0.05]
  yaw: [0, 0]

camera_offset_ranges:
  x: [-0.0, 0.0]
  y: [-0.0, 0.0]
  z: [-0.0, 0.0]

camera_rpy_ranges: 
  roll: [0, 0]
  pitch: [0, 0]
  yaw: [0, 0]

focal_length_range: [0.895, 0.895]

depth_noise_ranges:
  active: False
  binocular_baseline: [.02, .05]
  depth_smoothing: [1, 1]
  noise_all: [.0, .4]
  noise_wide: [0., 0.3]
  noise_local: [0., 0.2]
  noise_pixel: [0.0, 0.03]


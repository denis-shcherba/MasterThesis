defaults:
  - _self_  
  - model: transformer_depth
  - loss: default_3d_mse
  - data: depth
  - trainer: epochs
  - inference: transformer_depth

train:
  batch_size: 128
  num_workers: 8
  device: cuda

# Global settings
observation_mode: 'depth'  
seed: 42
experiment_name: "SimpleSingleStepBC"

is_regression: false
# whether to use a separate network for waypoint and timing prediction naming
is_waypointPlusTimings: false

wandb:
  enabled: true

hydra:
  run:
    dir: ./test_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
defaults:
  - _self_  
  - model: recurrent_depth
  - loss: default_3d
  - optimizer: adam
  - data: depth
  - inference: mlp_depth
train:
  batch_size: 128
  num_workers: 8
  epochs: 50
  device: cuda

# Global settings
observation_mode: 'depth'  
seed: 42
experiment_name: "SimpleSingleStepBC"
output_dir: ${hydra:runtime.output_dir}


is_regression: false

wandb:
  enabled: true
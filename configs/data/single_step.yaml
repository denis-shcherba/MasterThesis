# Path to the HDF5 file containing demonstrations
h5_file_path: demos/test_deltas.h5

# Data loading parameters
batch_size: 32
num_workers: 4

# Sequence settings
sequence_length: 1  # Number of consecutive timesteps to use as input
action_dim: 3       # Dimension of action space (in SE3 9D representation)
num_points: 1000    # Number of points per point cloud

# Dataset split
train_split: 0.8    # Fraction of data to use for training

# Data processing options
normalize_points: true  # Whether to normalize point clouds to unit sphere
augment_data: false      # Whether to apply data augmentation for training

# Optional parameters
subsample_demos: null   # If specified, randomly subsample this many demos
random_seed: 42         # Random seed for reproducibility

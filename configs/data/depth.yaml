# Path to the HDF5 file containing demonstrations
h5_file_path: demos/normal2000_jointspace.h5

# Data loading parameters
batch_size: ${train.batch_size}  
num_workers: ${train.num_workers}  

# Sequence settings
sequence_length: 8  # Number of consecutive timesteps to use as input
future_sequence_length: 8
action_dim: 7       # Dimension of action space 

# Dataset split
train_split: 0.8    # Fraction of data to use for training

# Data processing options
is_regression: ${is_regression}  
is_waypointPlusTimings: ${is_waypointPlusTimings}  

# Optional parameters
random_seed: 42         # Random seed for reproducibility

#normalization options
normalize_depth: true  
normalize_actions: true
depth_normalization_method: 'minmax'  
action_normalization_method: 'minmax' 

#augmentation
augment_data: false      
depth_dropout_prob: 0.001 # Probability of dropping out depth values during augmentation
depth_noise_scale: 0.01 # Scale of noise to add to depth values during augmentation
# Path to the HDF5 file containing demonstrations
h5_file_path: demos/wayPlusTimings1000.h5

# Data loading parameters
batch_size: ${train.batch_size}  # Batch size for training
num_workers: ${train.num_workers}  

# Sequence settings
sequence_length: 10  # Number of consecutive timesteps to use as input
action_dim: 3       # Dimension of action space 

# Dataset split
train_split: 0.8    # Fraction of data to use for training

# Data processing options
is_regression: ${is_regression}  
is_waypointPlusTimings: ${is_waypointPlusTimings}  

# Optional parameters
random_seed: 42         # Random seed for reproducibility

#normalization options
normalize_depth: true   # Normalize depth images
normalize_actions: true # Normalize actions
depth_normalization_method: 'minmax'  # Method for depth normalization
action_normalization_method: 'zscore'  # Method for action normalization
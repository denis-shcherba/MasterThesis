# Path to the HDF5 file containing demonstrations
h5_file_path: demos/depth1000tries.h5

# Data loading parameters
batch_size: 32
num_workers: 4

# Sequence settings
sequence_length: 1  # Number of consecutive timesteps to use as input
action_dim: 3       # Dimension of action space 
num_points: 3000    # Number of points per point cloud

# Dataset split
train_split: 0.8    # Fraction of data to use for training

# Data processing options

is_regression: false  # Whether the task is regression (true) or classification (false)

# Optional parameters
subsample_demos: null   # If specified, randomly subsample this many demos
random_seed: 42         # Random seed for reproducibility
